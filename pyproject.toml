[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "giftbook-bridge"
version = "0.1.0"
description = "Same-origin Bilibili Super Chat bridge for GiftBook"
requires-python = ">=3.8"
dependencies = [
    "aiohttp~=3.9.0",
    "blivedm @ file:///${PROJECT_ROOT}/blivedm",
]

[project.scripts]
giftbook-bridge = "giftbook_bridge.__main__:main"
giftbook-processor = "giftbook_bridge.__main__:main"

[tool.pdm]
distribution = true
